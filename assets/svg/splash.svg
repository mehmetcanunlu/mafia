    <rect x="1010" y="2000" width="30" height="226" fill="#5b7185"/>
    <rect x="1692" y="2000" width="30" height="226" fill="#5b7185"/>
    <line x1="996" y1="2064" x2="1054" y2="2064" stroke="#5b7185" stroke-width="16"/>
