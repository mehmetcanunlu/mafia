    <clipPath id="crownClip">
      <path d="M 384 576 C 384 424 410 300 512 300 C 614 300 640 424 640 576 Z"/>
    </clipPath>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Boğaz silüeti -->
  <path d="M 1780 -100 C 1560 500 2140 860 1780 1400 C 1540 1780 1960 2260 1850 2832"
